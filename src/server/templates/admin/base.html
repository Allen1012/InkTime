<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}InkTime 后台管理{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
  <header class="admin-header">
    <a class="admin-brand" href="{{ url_for('admin.index') }}">InkTime 后台管理</a>
    {% if current_user.is_authenticated %}
      <div class="admin-account">
        <span>{{ current_user.username }}</span>
        <form action="{{ url_for('admin.logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="button button-secondary" type="submit">退出登录</button>
        </form>
      </div>
    {% endif %}
  </header>
  <main class="admin-main">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert" role="alert">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
