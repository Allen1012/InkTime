  彩色 emoji 与暗色极简风格冲突，且各系统字体渲染差异大。

  id 与 src/server/weather.py 的 WEATHER_ICONS 一一对应，新增图标需同步两处。
  currentColor 让颜色随文字走，深浅主题都能用。
#}
