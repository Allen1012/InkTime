services:
  inktime-schema:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      DB_PATH: /app/data/photos.db
      IMAGE_DIR: /app/data/photos
      BIN_OUTPUT_DIR: /app/data/output
    volumes:
      - ../data:/app/data
    command:
      - python
      - scripts/database_admin.py
      - check-schema
      - --database
      - /app/data/photos.db
    restart: "no"

  inktime-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: inktime-server
    environment:
      # 家庭局域网默认使用普通 HTTP；公网部署必须通过覆盖文件切换 production 与 HTTPS。
      APP_ENV: development
      SESSION_COOKIE_SECURE: "False"
      PYTHONUNBUFFERED: "1"
      DB_PATH: /app/data/photos.db
      IMAGE_DIR: /app/data/photos
      BIN_OUTPUT_DIR: /app/data/output
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5005"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      # 外部照片库属于高级配置：使用 Compose override 同时覆盖 IMAGE_DIR，
      # 并把宿主目录显式挂载到容器内路径；后台只能选择已经挂载的目录。
    ports:
      - "${FLASK_PORT:-5005}:5005"
    depends_on:
      inktime-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  inktime-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: inktime-worker
    environment:
      APP_ENV: development
      SESSION_COOKIE_SECURE: "False"
      PYTHONUNBUFFERED: "1"
      DB_PATH: /app/data/photos.db
      IMAGE_DIR: /app/data/photos
      BIN_OUTPUT_DIR: /app/data/output
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    command: ["python", "-m", "src.analysis.run_worker"]
    depends_on:
      inktime-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  inktime-analyzer:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      DB_PATH: /app/data/photos.db
      IMAGE_DIR: /app/data/photos
      BIN_OUTPUT_DIR: /app/data/output
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    command: ["python", "-m", "src.analysis.analyze_photos_docker"]
    depends_on:
      inktime-schema:
        condition: service_completed_successfully

  inktime-render-7c:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      DB_PATH: /app/data/photos.db
      IMAGE_DIR: /app/data/photos
      BIN_OUTPUT_DIR: /app/data/output
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    command: ["python", "-m", "src.render.render_daily_photo"]
    depends_on:
      inktime-schema:
        condition: service_completed_successfully

  inktime-render-133c:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      DB_PATH: /app/data/photos.db
      IMAGE_DIR: /app/data/photos
      BIN_OUTPUT_DIR: /app/data/output
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    command: ["python", "-m", "src.render.render_daily_photo_133c"]
    depends_on:
      inktime-schema:
        condition: service_completed_successfully
