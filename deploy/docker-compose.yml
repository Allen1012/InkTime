services:
  inktime-schema:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      DB_PATH: /app/data/photos.db
    volumes:
      - ../data:/app/data
    command:
      - python
      - scripts/database_admin.py
      - check-schema
      - --database
      - /app/data/photos.db
    restart: "no"

  inktime-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: inktime-server
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      DB_PATH: /app/data/photos.db
      BIN_OUTPUT_DIR: /app/data/output
      IMAGE_DIR: ${IMAGE_DIR:?IMAGE_DIR must be an absolute host path}
      FLASK_HOST: 0.0.0.0
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      # 上传、软删除、恢复和回收站清理需要读写照片目录。
      # 数据库保存照片绝对路径，因此容器内必须挂载到同一个绝对路径。
      - ${IMAGE_DIR}:${IMAGE_DIR}
    ports:
      - "${FLASK_PORT:-5005}:${FLASK_PORT:-5005}"
    depends_on:
      inktime-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  inktime-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: inktime-worker
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      DB_PATH: /app/data/photos.db
      BIN_OUTPUT_DIR: /app/data/output
      IMAGE_DIR: ${IMAGE_DIR:?IMAGE_DIR must be an absolute host path}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ${IMAGE_DIR}:${IMAGE_DIR}
    command: ["python", "-m", "src.analysis.run_worker"]
    depends_on:
      inktime-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  inktime-analyzer:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      DB_PATH: /app/data/photos.db
      BIN_OUTPUT_DIR: /app/data/output
      IMAGE_DIR: ${IMAGE_DIR:?IMAGE_DIR must be an absolute host path}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ${IMAGE_DIR}:${IMAGE_DIR}:ro
    command: ["python", "-m", "src.analysis.analyze_photos_docker"]
    depends_on:
      inktime-schema:
        condition: service_completed_successfully

  inktime-render-7c:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      DB_PATH: /app/data/photos.db
      BIN_OUTPUT_DIR: /app/data/output
      IMAGE_DIR: ${IMAGE_DIR:?IMAGE_DIR must be an absolute host path}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ${IMAGE_DIR}:${IMAGE_DIR}:ro
    command: ["python", "-m", "src.render.render_daily_photo"]
    depends_on:
      inktime-schema:
        condition: service_completed_successfully

  inktime-render-133c:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      DB_PATH: /app/data/photos.db
      BIN_OUTPUT_DIR: /app/data/output
      IMAGE_DIR: ${IMAGE_DIR:?IMAGE_DIR must be an absolute host path}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ${IMAGE_DIR}:${IMAGE_DIR}:ro
    command: ["python", "-m", "src.render.render_daily_photo_133c"]
    depends_on:
      inktime-schema:
        condition: service_completed_successfully
